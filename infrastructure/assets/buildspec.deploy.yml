version: 0.2

# Deploy buildspec — loaded into the '<name>-build' CodeBuild project by CDK
# (project source is NO_SOURCE; the repo is cloned below).
#
# The GitHub Actions deploy job detects which service dirs changed and starts
# this build with env overrides:
#   CHANGED_SERVICES  space-separated dirs ("backend", "frontend",
#                     "model-server" — any subset)
#   IMAGE_TAG         tag to publish (the push commit SHA; 'latest' also updated)
# Project env provides: REPO_URL, ECR_REGISTRY, ECR_BACKEND_REPO,
# ECR_FRONTEND_REPO, ECR_MODEL_SERVER_REPO, APP_DIR, INSTANCE_ID.

phases:
  pre_build:
    commands:
      - git clone --quiet "$REPO_URL" src
      - cd src && git checkout --quiet "$IMAGE_TAG"
      - echo "deploying [$CHANGED_SERVICES] at $IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - |
        cd src   # phases run separate shells — pre_build's cd doesn't persist
        for svc in $CHANGED_SERVICES; do
          case "$svc" in
            backend)      repo="$ECR_BACKEND_REPO" ;;
            frontend)     repo="$ECR_FRONTEND_REPO" ;;
            model-server) repo="$ECR_MODEL_SERVER_REPO" ;;
            *) echo "unknown service '$svc'"; exit 1 ;;
          esac
          echo "=== building $svc -> $ECR_REGISTRY/$repo:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$repo:$IMAGE_TAG" -t "$ECR_REGISTRY/$repo:latest" "$svc"
          docker push "$ECR_REGISTRY/$repo:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$repo:latest"
        done
        touch /tmp/deployed   # flag for post_build (env vars don't cross phases)

  post_build:
    commands:
      - |
        if [ ! -f /tmp/deployed ]; then
          echo "build phase failed or ran nothing — skipping redeploy"
          exit 0
        fi
        params=$(printf '{"commands":[
          "set -e",
          "cd %s",
          "git pull --ff-only",
          "sed -i s/^IMAGE_TAG=.*/IMAGE_TAG=%s/ .env",
          "aws ecr get-login-password --region %s | docker login --username AWS --password-stdin %s",
          "docker compose -f docker-compose.prod.yml pull",
          "docker compose -f docker-compose.prod.yml up -d"
        ]}' "$APP_DIR" "$IMAGE_TAG" "$AWS_DEFAULT_REGION" "$ECR_REGISTRY" | tr -d '\n')
        cmd=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "deploy $IMAGE_TAG" \
          --parameters "$params" \
          --query 'Command.CommandId' --output text)
        echo "ssm command: $cmd"
        while :; do
          st=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          case "$st" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
        done
        echo "ssm -> $st"
        [ "$st" = "Success" ]
