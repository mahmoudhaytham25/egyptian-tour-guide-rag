# LOCAL DEV overrides — auto-loaded by `docker compose` on top of
# docker-compose.yml. Re-adds what the prod base omits: every app service
# builds from source instead of pulling ECR images, and mongo + the backend
# publish host ports for local tooling.
#
# Host ports (dev only):
#   3000 frontend · 3001 backend · 27017 mongo (loopback only)
#
# IGNORED in prod — the deploy scripts always pass -f explicitly, and any
# -f disables this file's auto-load:
#   docker compose -f docker-compose.yml up -d

services:
  mongo:
    # Bound to localhost only — the backend reaches mongo over the compose
    # network; this mapping just enables local (non-docker) tooling.
    ports:
      - "127.0.0.1:27017:27017"

  model-server:
    build: ./model-server

  backend:
    build: ./backend
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time. "/api" = same-origin:
        # the frontend's nginx proxies /api/* to the backend service (see
        # frontend/nginx.conf), so the CSP needs no runtime configuration.
        VITE_API_URL: /api
