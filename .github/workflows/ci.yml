name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Shared mongo DSN for every job that talks to the service container —
# auth included, matching the docker-compose stack.
env:
  MONGODB_URI: mongodb://ci:ci-mongo-password@localhost:27017/egyptian_history_rag?authSource=admin

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npx jest

  backend-migrations:
    runs-on: ubuntu-latest
    services:
      mongo: &mongo-service
        image: mongo:7
        env:
          # Auth-enabled, matching the compose stack — the workflow-level
          # MONGODB_URI above carries the same pair.
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci-mongo-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Verify migrations apply, roll back, and re-apply
        working-directory: backend
        run: |
          npx migrate-mongo up
          npx migrate-mongo down
          npx migrate-mongo up

  model-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            model-server/requirements.txt
            model-server/requirements-dev.txt
      - name: Install test dependencies
        working-directory: model-server
        # Full requirements are needed — tests/test_model_server.py imports
        # the Flask app (test stubs keep it offline).
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: model-server
        run: python -m pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    # compose interpolates ${VAR:?} at parse time — dummy values get past
    # validation; the model server only warns on a missing/invalid Gemini
    # key at boot (it's only used on real API calls, which the smoke
    # assertions never make).
    env:
      GEMINI_API_KEY: ci-dummy
      JWT_SECRET: ci-dummy-secret
      INTERNAL_API_TOKEN: ci-dummy-token
      MONGO_INITDB_ROOT_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@v7
      - name: Build all images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      # Waits on the proxied health endpoint — that one URL proves nginx is
      # up, /api is forwarded to the backend, the backend is up, and its
      # compose depends_on chain (mongo + model-server healthy, migrations
      # applied) succeeded.
      - name: Wait for healthy services
        run: |
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)" = "200" ]; then
              echo "stack healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy"
          docker compose ps
          docker compose logs --tail 60
          exit 1
      - name: Smoke assertions
        run: |
          set -e
          # Static SPA serves with the hardened CSP (same-origin 'self' —
          # the /api proxy means no extra connect-src origin is needed).
          curl -sfI http://localhost:3000/ | \
            grep -i "content-security-policy:.*connect-src 'self'"

          # /api is proxied through nginx to the backend.
          curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'

          # The backend's own published port still answers (dev path —
          # vite dev / local tooling hit it directly).
          curl -sf http://localhost:3001/api/health | grep -q '"status":"ok"'

          # A full auth round-trip through the proxy: JSON body through
          # nginx -> backend -> mongo -> signed JWT back out.
          curl -sf -X POST http://localhost:3000/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@ci.dev","password":"smoke-pass-123"}' | \
            grep -q '"token"'

          # The model server must NOT be published on the host — only the
          # backend reaches it (X-Internal-Token gated).
          if curl -sf --max-time 3 http://localhost:5050/health; then
            echo "model-server unexpectedly reachable from the host"
            exit 1
          fi

          echo "all smoke assertions passed"
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      mongo: *mongo-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply migrations
        working-directory: backend
        run: npx migrate-mongo up
      # The e2e suite never reaches the Flask model server (it needs a real
      # GEMINI_API_KEY), but server.js still requires MODEL_SERVER_URL and
      # INTERNAL_API_TOKEN to be present. CORS_ORIGIN must whitelist the vite
      # preview origin — :4173 isn't in the backend's default dev origins.
      - name: Start backend
        working-directory: backend
        run: >
          env JWT_SECRET=e2e-secret
          MODEL_SERVER_URL=http://localhost:5050
          INTERNAL_API_TOKEN=e2e-token
          CORS_ORIGIN=http://localhost:4173
          RATE_LIMIT_DISABLED=true
          node server.js &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || true)
            if [ "$code" = "200" ]; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Get Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Browsers (~150MB) are cached per @playwright/test version — a hit
      # skips the download; install-deps still runs since system libs aren't
      # cacheable (it's a fast no-op when they're present).
      - name: Cache Playwright browsers
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npx playwright install-deps
      - name: Install Playwright browsers
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

  # Path-filtered deploy trigger: diffs the push range, then hands off to
  # CodeBuild, which clones the repo, builds+pushes each changed service
  # image, and redeploys the EC2 box via SSM (all inside the buildspec).
  # Auth is OIDC — the role (AWS_DEPLOY_ROLE_ARN secret) is created by the
  # infrastructure/ CDK app and only assumable from this repo's main branch.
  deploy:
    if: github.event_name == 'push'
    needs: [backend-tests, backend-migrations, model-server-tests, frontend-tests, compose-smoke, frontend-e2e]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need HEAD + the push's base commit for the diff

      - name: Detect changed service directories
        id: changes
        run: |
          before="${{ github.event.before }}"
          # All-zero 'before' (first push to a branch) or missing object —
          # deploy everything.
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "services=backend frontend model-server" >> "$GITHUB_OUTPUT"
          else
            svcs=$(git diff --name-only "$before" "$GITHUB_SHA" \
              | cut -d/ -f1 | grep -E '^(backend|frontend|model-server)$' | sort -u | tr '\n' ' ' || true)
            echo "services=$svcs" >> "$GITHUB_OUTPUT"
          fi

      # The AWS side only exists once the infrastructure/ CDK app is
      # deployed and the 3 repo entries are set — until then, skip instead
      # of failing on missing config (a service-code push is still a
      # green CI run without a deploy target).
      - name: Check deploy configuration
        id: deploycfg
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          PROJECT: ${{ vars.CODEBUILD_PROJECT }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$REGION" ] || [ -z "$PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS deploy not configured (needs AWS_DEPLOY_ROLE_ARN secret + AWS_REGION/CODEBUILD_PROJECT vars) — skipping"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.changes.outputs.services != '' && steps.deploycfg.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger deploy build
        if: steps.changes.outputs.services != '' && steps.deploycfg.outputs.configured == 'true'
        id: start
        run: |
          id=$(aws codebuild start-build \
            --project-name "${{ vars.CODEBUILD_PROJECT }}" \
            --environment-variables-override \
              name=CHANGED_SERVICES,value="${{ steps.changes.outputs.services }}" \
              name=IMAGE_TAG,value="$GITHUB_SHA" \
            --query 'build.id' --output text)
          echo "build_id=$id" >> "$GITHUB_OUTPUT"
          {
            echo "deploy build started: \`$id\`"
            echo "[build history](https://${{ vars.AWS_REGION }}.console.aws.amazon.com/codesuite/codebuild/projects/${{ vars.CODEBUILD_PROJECT }}/history)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Poll the build so a red deploy shows up as a red check. Bounded by
      # the CodeBuild project's 45-min timeout (plus slack) — a stuck build
      # times out on the AWS side and this reports it.
      - name: Wait for deploy build
        if: steps.changes.outputs.services != '' && steps.deploycfg.outputs.configured == 'true'
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          for i in $(seq 1 150); do
            st=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
            case "$st" in
              IN_PROGRESS) sleep 20 ;;
              SUCCEEDED) echo "deploy build succeeded"; exit 0 ;;
              *) echo "deploy build ended: $st"; exit 1 ;;
            esac
          done
          echo "timed out waiting for deploy build"; exit 1

      - name: Skip — no service code changed
        if: steps.changes.outputs.services == ''
        run: echo "push touched no backend/, frontend/ or model-server/ files — nothing to deploy"
