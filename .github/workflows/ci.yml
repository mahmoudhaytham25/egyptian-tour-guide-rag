name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npx jest

  backend-migrations:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Verify migrations apply, roll back, and re-apply
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/egyptian_history_rag
        run: |
          npx migrate-mongo up
          npx migrate-mongo down
          npx migrate-mongo up

  model-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model-server/requirements-dev.txt
      - name: Install test dependencies
        working-directory: model-server
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: model-server
        run: python -m pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose interpolates ${VAR:?} at parse time even for `build`, so
      # dummy values are required to get past validation. Building all three
      # images is also the only CI coverage of model-server/requirements.txt
      # (the model-server-tests job installs requirements-dev.txt only).
      - name: Build all images
        env:
          GEMINI_API_KEY: ci-dummy
          JWT_SECRET: ci-dummy
          INTERNAL_API_TOKEN: ci-dummy
        run: docker compose build

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply migrations
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/egyptian_history_rag
        run: npx migrate-mongo up
      # The e2e suite never reaches the Flask model server (it needs a real
      # GEMINI_API_KEY), but server.js still requires MODEL_SERVER_URL and
      # INTERNAL_API_TOKEN to be present. CORS_ORIGIN must whitelist the vite
      # preview origin — :4173 isn't in the backend's default dev origins.
      - name: Start backend
        working-directory: backend
        run: >
          env JWT_SECRET=e2e-secret
          MONGODB_URI=mongodb://localhost:27017/egyptian_history_rag
          MODEL_SERVER_URL=http://localhost:5050
          INTERNAL_API_TOKEN=e2e-token
          CORS_ORIGIN=http://localhost:4173
          RATE_LIMIT_DISABLED=true
          node server.js &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || true)
            if [ "$code" = "200" ]; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Get Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Browsers (~150MB) are cached per @playwright/test version — a hit
      # skips the download; install-deps still runs since system libs aren't
      # cacheable (it's a fast no-op when they're present).
      - name: Cache Playwright browsers
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npx playwright install-deps
      - name: Install Playwright browsers
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
