# Egyptian Tour Guide RAG — production compose: pulls pre-built images from
# ECR instead of building locally. Used by the EC2 user_data bootstrap; the
# ECR_* + IMAGE_TAG + secret vars are written into .env by the bootstrap
# (see infrastructure/assets/user_data.sh).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Shared service definitions (env, volumes, healthchecks, depends_on, named
# volumes) live in docker-compose.base.yml — `include`d below, so the
# single -f invocation above keeps working. Same layout as dev — mongo and
# the model server are internal-only, nginx proxies /api to the backend,
# so APP_PORT is the only public surface. Unlike dev, neither mongo's
# :27017 nor the backend's :3001 is published.

include:
  - docker-compose.base.yml

services:
  model-server:
    image: ${ECR_REGISTRY}/${ECR_MODEL_SERVER_REPO}:${IMAGE_TAG}

  backend:
    image: ${ECR_REGISTRY}/${ECR_BACKEND_REPO}:${IMAGE_TAG}
    init: true

  frontend:
    image: ${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${IMAGE_TAG}
    ports:
      - "${APP_PORT:-3000}:8080"
