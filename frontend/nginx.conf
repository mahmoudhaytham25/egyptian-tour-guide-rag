# nginx-unprivileged runs as a non-root user and listens on 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # NOTE: an add_header inside a `location` replaces ALL inherited
    # server-level add_headers, so the security headers are repeated in
    # every location that sets its own headers.
    #
    # connect-src: the browser calls the backend API directly
    # (VITE_API_URL, default http://localhost:3001). If you deploy
    # with a different API origin, update this value to match.
    location /assets/ {
        # Vite emits content-hashed filenames under /assets — cache forever.
        expires 1y;
        add_header Cache-Control "immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:3001; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        # SPA fallback — client-side routes (/chat, /register) must resolve
        # to index.html so react-router can handle them. Always revalidate
        # the HTML so new deploys take effect immediately.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:3001; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
