server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback — client-side routes (/chat, /home, /register) must
        # resolve to index.html so react-router can handle them.
        try_files $uri $uri/ /index.html;
    }
}
