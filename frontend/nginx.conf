# nginx-unprivileged runs as a non-root user and listens on 8080.
#
# Fully static config — no templating step. The browser only ever talks to
# this origin: /api/* is proxied to the backend service, so the CSP
# connect-src is a plain 'self' and VITE_API_URL bakes a relative "/api"
# into the bundle.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # PDFs upload through the proxy too — stay above the backend's
    # 50 MB multer limit or nginx 413s the request first.
    client_max_body_size 55m;

    # Re-resolve the backend name per request: compose can hand the
    # container a new IP on recreate, and an IP cached at startup would
    # 502 until this container restarted. 127.0.0.11 is docker's
    # embedded DNS.
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:3001;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /query can legitimately take ~5 min waiting on the model
        # server (the backend's axios timeout is 300s) — the default
        # 60s read timeout would cut a slow answer off mid-flight.
        proxy_read_timeout 320s;
        proxy_connect_timeout 10s;

        # Proxied requests all arrive from this container's IP, so the
        # backend's IP rate limiter buckets them together — fine for
        # single-tenant use. No security headers here: the backend sets
        # its own via helmet.
    }

    # NOTE: an add_header inside a `location` replaces ALL inherited
    # server-level add_headers, so the security headers are repeated in
    # every location that sets its own headers.
    location /assets/ {
        # Vite emits content-hashed filenames under /assets — cache forever.
        expires 1y;
        add_header Cache-Control "immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        # SPA fallback — client-side routes (/chat, /register) must resolve
        # to index.html so react-router can handle them. Always revalidate
        # the HTML so new deploys take effect immediately.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
