# Egyptian Tour Guide RAG — dev compose: builds every service from source
# and publishes the dev ports. Shared service definitions (env, volumes,
# healthchecks, depends_on, named volumes) live in docker-compose.base.yml,
# pulled in via `include` so plain `docker compose up --build` still works.
# The explicit multi-file form is equivalent:
#
#   docker compose -f docker-compose.base.yml -f docker-compose.yml up --build

include:
  - docker-compose.base.yml

services:
  mongo:
    # Bound to localhost only — the backend reaches mongo over the compose
    # network; this mapping just enables local (non-docker) tooling.
    ports:
      - "127.0.0.1:27017:27017"

  model-server:
    build: ./model-server

  backend:
    build: ./backend
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time. "/api" = same-origin:
        # the frontend's nginx proxies /api/* to the backend service (see
        # frontend/nginx.conf), so the CSP needs no runtime configuration.
        VITE_API_URL: /api
    ports:
      - "3000:8080"
