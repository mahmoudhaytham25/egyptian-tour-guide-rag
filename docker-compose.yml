services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Bound to localhost only — the backend reaches mongo over the compose
    # network; this mapping just enables local (non-docker) tooling.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-server:
    build: ./model-server
    restart: unless-stopped
    environment:
      # Required: provide via a root .env file or the shell environment
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      # Shared secret the backend must send as X-Internal-Token
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # NOTE: no HOST/PORT here — gunicorn's CMD hard-codes --bind
      # 0.0.0.0:5050; those env vars are only read by the __main__ dev path.
    volumes:
      # Uploaded PDFs — shared with the backend (uploads land here).
      # Seeded with the image's bundled data/egyptian_history.pdf on first run.
      - rag-data:/app/data
      # Generated index files (*_vectors.npz, *_metadata.json)
      - vector-store:/app/vector_store
    # Not published on the host — only the backend may reach it (auth-gated
    # via X-Internal-Token).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5050/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    # depends_on only orders startup; the backend's docker-entrypoint.sh
    # additionally waits until mongo accepts connections, runs
    # `migrate-mongo up` (DB migrations), then starts the server.
    depends_on:
      mongo:
        condition: service_healthy
      model-server:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/egyptian_history_rag
      # No fallback — a missing JWT_SECRET fails compose up front instead of
      # silently signing tokens with a guessable key.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      MODEL_SERVER_URL: http://model-server:5050
      # Comma-separated extra origins, e.g. a deployed frontend URL
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      # The backend resolves data/ and vector_store/ via ../model-server/
      # relative to its own root (/app), i.e. /model-server/... — the named
      # volumes keep them in sync with the model-server container.
      - rag-data:/model-server/data
      - vector-store:/model-server/vector_store
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time — must be the address
        # the *browser* uses to reach the backend (localhost, port-mapped).
        VITE_API_URL: http://localhost:3001/api
    environment:
      # Runtime counterpart to VITE_API_URL: rendered into the CSP's
      # connect-src by the image's docker-entrypoint (envsubst). Must be
      # the ORIGIN of the API the browser calls — scheme://host[:port],
      # no /api path. Override in .env for a real deploy; no rebuild.
      API_CONNECT_SRC: ${API_CONNECT_SRC:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    # nginx-unprivileged listens on 8080 (see
    # frontend/default.conf.template); the alpine-based image ships busybox
    # wget for the probe.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
  rag-data:
  vector-store:
